name: Price feed probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          for u in "https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT" "https://api.coinbase.com/v2/exchange-rates?currency=XAU" "https://api.coinbase.com/v2/prices/XAU-USD/spot" "https://forex-data-feed.swissquote.com/public-quotes/bboquotes/instrument/XAU/USD" "https://api.kraken.com/0/public/Ticker?pair=PAXGUSD"; do
            echo "=== $u"
            curl -sS -m 15 -D - -o body -H "Origin: https://goldledger.web.app" "$u" | grep -iE "^HTTP|access-control-allow-origin|cache-control" || true
            head -c 250 body; echo
          done
          echo "=== coinbase XAU polling"
          for i in $(seq 1 6); do echo "$(date +%T) $(curl -s https://api.coinbase.com/v2/exchange-rates?currency=XAU | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["rates"]["USD"])' 2>&1 | head -c 80) | $(curl -s https://api.coinbase.com/v2/prices/XAU-USD/spot | head -c 120)"; sleep 5; done
