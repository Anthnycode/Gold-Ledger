name: Price feed probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - shell: bash {0}
        run: |
          npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch(); const p = await b.newPage();
          p.on('console', m => console.log('console:', m.type(), m.text().slice(0, 300)));
          await p.goto('https://goldledger.web.app/', { waitUntil: 'networkidle' });
          console.log('fab exists:', await p.$('#askFab') !== null);
          const r = await p.evaluate(async () => {
            try { await geminiSample([{ role: 'user', content: 'x' }, { role: 'user', content: 'hi' }]); } catch {}
            const out = [];
            for (const name of ['gemini-3.6-flash', 'gemini-3-flash', 'gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.0-flash']) {
              try { const m = aiMods.ai.getGenerativeModel(aiMods.inst, { model: name }); const res = await m.generateContent('What is 2+2? One short sentence.'); out.push(name + ' OK ' + res.response.text()); }
              catch (e) { out.push(name + ' ERR ' + String(e.message).slice(0, 400)); }
            }
            return out.join('\n');
          });
          console.log('RESULT', r);
          await b.close();
          JS
          node t.mjs
