name: Publish to Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for key
        id: key
        run: if [ -n "$KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; else echo "No FIREBASE_SERVICE_ACCOUNT secret yet, skipping."; fi
      - uses: google-github-actions/auth@v2
        if: steps.key.outputs.ok == '1'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy
        if: steps.key.outputs.ok == '1'
        run: |
          FB="npx -y firebase-tools@13 --project gold-ledger-96dee"
          SITE=""
          for name in goldledger thegoldledger goldledger-app mygoldledger gold-ledger-96dee; do
            if $FB hosting:sites:get "$name" >/dev/null 2>&1 || $FB hosting:sites:create "$name" >/dev/null 2>&1; then SITE="$name"; break; fi
          done
          [ -n "$SITE" ] || { echo "No site name available"; exit 1; }
          echo "Publishing to https://$SITE.web.app"
          sed -i "s/\"site\": \"[^\"]*\"/\"site\": \"$SITE\"/" firebase.json
          $FB deploy --only hosting --non-interactive
